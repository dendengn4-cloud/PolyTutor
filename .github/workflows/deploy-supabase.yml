name: Deploy Supabase (база данных)

# Применяет новые миграции к базе Supabase — для каждого включённого языка (langs.json) в его раздел базы
# (см. supabase/README.md). Нужен один секрет: SUPABASE_DB_PASSWORD — пароль базы (Project Settings → Database).
# Запускается при изменениях в папке supabase/ или langs.json, либо вручную (Actions → Run workflow).
on:
  push:
    branches: [main]
    paths: ['supabase/**', 'langs.json', 'scripts/migrate.py', 'scripts/sqlrender.py', '.github/workflows/deploy-supabase.yml']
  workflow_dispatch:

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

env:
  # Не секреты (Settings → Secrets and variables → Actions → Variables):
  #   SUPABASE_PROJECT_REF — ID проекта (из адреса https://<ID>.supabase.co),
  #   SUPABASE_DB_HOST — адрес пула подключений (Supabase → Connect → Session pooler, например aws-0-eu-central-1.pooler.supabase.com)
  DB_HOST: ${{ vars.SUPABASE_DB_HOST }}
  DB_PORT: '5432'
  DB_USER: postgres.hsypubcxczyvvfesgudj

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Сборка строки подключения
        env:
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$DB_PASSWORD" ]; then
            echo "::error::Не задан секрет SUPABASE_DB_PASSWORD (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          ENC=$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["DB_PASSWORD"].strip(), safe=""))')
          echo "::add-mask::$ENC"
          echo "SUPABASE_DB_URL=postgresql://${DB_USER}:${ENC}@${DB_HOST}:${DB_PORT}/postgres" >> "$GITHUB_ENV"

      - name: Проверка подключения
        run: |
          psql "$SUPABASE_DB_URL" -tAc "select 'Подключение к базе OK, ' || version()"

      - name: Применение миграций
        run: python3 scripts/migrate.py | tee -a "$GITHUB_STEP_SUMMARY"
