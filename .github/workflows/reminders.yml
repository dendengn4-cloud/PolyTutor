# Напоминания от бота. Раз в час, для каждого включённого языка (langs.json): кладёт в его раздел базы одноразовый
# пропуск и вызывает бота (маршрут /cron, {"lang": "<код>"}); бот сам решает, кому пора написать.
# Новых секретов не нужно: используется тот же пароль базы, что и для миграций (SUPABASE_DB_PASSWORD).
# Заодно этот запуск каждый час обращается к базе — бесплатный проект Supabase не «засыпает».
name: Напоминания

on:
  schedule:
    - cron: '7 * * * *'      # каждый час в :07 (GitHub может запускать с задержкой в несколько минут)
  workflow_dispatch:

concurrency:
  group: reminders
  cancel-in-progress: false

env:
  DB_HOST: ${{ vars.SUPABASE_DB_HOST }}
  DB_PORT: '5432'
  DB_USER: postgres.${{ vars.SUPABASE_PROJECT_REF }}
  BOT_URL: https://${{ vars.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1/telegram-bot/cron

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Пропуск и вызов бота
        env:
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$DB_PASSWORD" ]; then echo "::error::Не задан секрет SUPABASE_DB_PASSWORD"; exit 1; fi
          ENC=$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["DB_PASSWORD"].strip(), safe=""))')
          echo "::add-mask::$ENC"
          URL="postgresql://${DB_USER}:${ENC}@${DB_HOST}:${DB_PORT}/postgres"
          FAIL=0
          for L in $(python3 scripts/langs.py codes); do
            TOKEN=$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')
            echo "::add-mask::$TOKEN"
            psql "$URL" -v ON_ERROR_STOP=1 -q -c "insert into $L.cron_tokens (token) values ('$TOKEN')"
            # ежедневная чистка данных: функция сама выполняется не чаще раза в сутки
            CLEAN=$(psql "$URL" -tA -q -c "select $L.maintenance_daily()" 2>&1 || echo "чистка: ошибка")
            echo "[$L] Чистка данных: $CLEAN" >> "$GITHUB_STEP_SUMMARY"
            RES=$(curl -sS -m 300 -X POST "$BOT_URL" -H "X-Cron-Token: $TOKEN" -H 'Content-Type: application/json' -d "{\"lang\":\"$L\"}" || true)
            echo "[$L] Ответ бота: $RES"
            echo "[$L] Напоминания: $RES" >> "$GITHUB_STEP_SUMMARY"
            echo "$RES" | grep -q '"ok":true' || FAIL=1
          done
          exit $FAIL
