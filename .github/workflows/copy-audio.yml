# Копирование готовой озвучки из другого (публичного) репозитория с аудио — например, из армянского приложения:
# newgden-ai/Armenian-audio → <логин>/audio-hy. Озвучивать заново не нужно: слова и номера файлов те же.
# Запуск вручную: Actions → «Копирование аудио» → Run workflow. Повторный запуск докопирует только новые файлы.
#   1. копирует mp3, которых ещё нет, в репозиторий с аудио этого языка (переменная AUDIO_REPO, секрет AUDIO_REPO_TOKEN);
#   2. отмечает все файлы, которые теперь есть в репозитории с аудио, в data/<язык>/audio_voiced.txt;
#   3. запускает «Import Vocabulary» — в приложении появляются кнопки звука.
name: Копирование аудио

on:
  workflow_dispatch:
    inputs:
      lang:
        description: 'Язык (код из langs.json)'
        default: hy
      source:
        description: 'Откуда копировать (публичный репозиторий с папкой audio/)'
        default: newgden-ai/Armenian-audio

permissions:
  contents: write
  actions: write

concurrency:
  group: tts
  cancel-in-progress: false

jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AUDIO_REPO_TOKEN: ${{ secrets.AUDIO_REPO_TOKEN }}
      AUDIO_REPO_PATTERN: ${{ vars.AUDIO_REPO }}
      TUTOR_LANG: ${{ inputs.lang }}
      SOURCE: ${{ inputs.source }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Проверка настроек
        run: |
          python3 scripts/langs.py check "$TUTOR_LANG"
          [ -n "$AUDIO_REPO_TOKEN" ] || { echo "::error::Не задан секрет AUDIO_REPO_TOKEN"; exit 1; }
          [ -n "$AUDIO_REPO_PATTERN" ] || { echo "::error::Не задана переменная AUDIO_REPO (например <логин>/audio-{lang})"; exit 1; }
          echo "AUDIO_REPO=${AUDIO_REPO_PATTERN//\{lang\}/$TUTOR_LANG}" >> "$GITHUB_ENV"
          echo "VOICED=data/$TUTOR_LANG/audio_voiced.txt" >> "$GITHUB_ENV"

      - name: Копирование файлов
        run: |
          git clone --depth 1 "https://github.com/${SOURCE}.git" source-audio
          git clone --depth 1 "https://x-access-token:${AUDIO_REPO_TOKEN}@github.com/${AUDIO_REPO}.git" audio-repo
          mkdir -p audio-repo/audio
          BEFORE=$(find audio-repo/audio -name '*.mp3' | wc -l)
          rsync -a --ignore-existing --include='*.mp3' --exclude='*' source-audio/audio/ audio-repo/audio/
          AFTER=$(find audio-repo/audio -name '*.mp3' | wc -l)
          echo "Было файлов: $BEFORE, стало: $AFTER" | tee -a "$GITHUB_STEP_SUMMARY"
          touch audio-repo/.nojekyll
          cd audio-repo
          git config user.name "tutor bot"
          git config user.email "actions@users.noreply.github.com"
          git add audio .nojekyll
          git commit -q -m "Копия озвучки из ${SOURCE}: $((AFTER - BEFORE)) файлов" || { echo "Новых файлов нет"; exit 0; }
          git push

      - name: Отметить озвученные файлы и обновить словарь
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          voiced = Path(os.environ['VOICED'])
          have = set(voiced.read_text(encoding='utf-8').split()) if voiced.exists() else set()
          files = {p.name for p in Path('audio-repo/audio').glob('*.mp3')}
          new = sorted(files - have)
          tail = voiced.read_bytes()[-1:] if voiced.exists() else b''
          with voiced.open('a', encoding='utf-8') as f:
              if tail and tail != b'\n':
                  f.write('\n')
              for name in new:
                  f.write(name + '\n')
          print(f'Отмечено новых файлов: {len(new)}, всего в списке: {len(have) + len(new)}')
          PY
          git config user.name "tutor bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$VOICED"
          git commit -m "Озвучено ($TUTOR_LANG): копия из ${SOURCE}" || { echo "Список не изменился"; exit 0; }
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push
          gh workflow run import-vocab.yml --ref "${GITHUB_REF_NAME}" -f lang="$TUTOR_LANG"
