# Озвучка слов и примеров без аудио одного языка (поле «Язык»). Запуск вручную: Actions → «Озвучка» → Run workflow.
# У каждого языка свой репозиторий с аудио: переменная AUDIO_REPO с {lang}, например <логин>/PolyTutor-AUDIO-{lang}.
#   1. собирает словарь языка и находит слова/примеры без аудио (scripts/langs/<язык>/tts.py);
#   2. озвучивает их выбранным сервисом:
#        армянский (hy): t5 — модель SpeechT5 (бесплатно, естественный голос); espeak — eSpeak NG («робот»);
#                        azure — Microsoft Azure (нужны секреты AZURE_TTS_KEY и AZURE_TTS_REGION);
#        узбекский (uz): gtts — Google (бесплатно, как исходные файлы); edge — Microsoft (бесплатно);
#        шведский (sv): edge — Microsoft (бесплатно, без регистрации, естественный голос); gtts — Google (бесплатно);
#        турецкий (tr): edge — Microsoft (бесплатно, без регистрации, голос tr-TR-EmelNeural); gtts — Google (бесплатно);
#   3. если задан секрет AUDIO_REPO_TOKEN — кладёт файлы в репозиторий с аудио (папка audio/), отмечает их
#      в data/<язык>/audio_voiced.txt и обновляет список файлов data/<язык>/audio_present.txt, затем запускает
#      «Import Vocabulary» — в приложении появляются кнопки звука;
#      без секрета — файлы можно скачать архивом (Artifacts) и загрузить в репозиторий с аудио вручную.
#   4. «Продолжать автоматически» (по умолчанию включено): после запуска сам начинается следующий (через «Паузу»),
#      пока всё не будет озвучено.
# Узбекский: сначала «Копирование аудио» (готовая озвучка Uzbek Tutor), потом — Озвучка только недостающего.
name: Озвучка

on:
  workflow_dispatch:
    inputs:
      lang:
        description: 'Язык (код из langs.json: hy, uz, sv, tr…)'
        default: hy
      engine:
        description: 'Сервис: auto — как в langs.json (hy — t5, uz — gtts, sv и tr — edge); hy — t5 / espeak / azure; uz — gtts / edge; sv, tr — edge / gtts'
        default: auto
        type: choice
        options: [auto, t5, espeak, azure, gtts, edge]
      voice:
        description: 'Голос Microsoft (для azure / edge), пусто — голос по умолчанию для языка'
        default: ''
      limit:
        description: 'Не больше файлов за запуск'
        default: '3000'
      auto:
        description: 'Продолжать автоматически: после запуска сам начнётся следующий, пока всё не будет озвучено'
        type: boolean
        default: true
      pause:
        description: 'Пауза перед следующим автоматическим запуском, минут (бережно к бесплатному сервису)'
        default: '10'
      round:
        description: 'Номер запуска в серии (заполняется автоматически; не больше 30)'
        default: '1'

permissions:
  contents: write
  actions: write

# Разные языки озвучиваются параллельно; один и тот же язык — по очереди (не больше одного запуска в ожидании)
concurrency:
  group: tts-${{ inputs.lang }}
  cancel-in-progress: false

jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      AUDIO_REPO_TOKEN: ${{ secrets.AUDIO_REPO_TOKEN }}
      AUDIO_REPO_PATTERN: ${{ vars.AUDIO_REPO }}    # например: <логин>/PolyTutor-AUDIO-{lang}
      TUTOR_LANG: ${{ inputs.lang }}
      ENGINE: ${{ inputs.engine }}
      VOICE: ${{ inputs.voice }}
      LIMIT: ${{ inputs.limit }}
      AZURE_TTS_KEY: ${{ secrets.AZURE_TTS_KEY }}
      AZURE_TTS_REGION: ${{ vars.AZURE_TTS_REGION }}  # например: westeurope
      AUTO: ${{ inputs.auto }}
      PAUSE: ${{ inputs.pause }}
      ROUND: ${{ inputs.round }}
    steps:
      - name: Пауза между автоматическими запусками
        if: inputs.round != '1'
        run: |
          P=$(( ${PAUSE:-10} )); [ "$P" -gt 30 ] && P=30; [ "$P" -lt 0 ] && P=0
          echo "Запуск ${ROUND} в серии — пауза ${P} мин"; sleep $(( P * 60 ))

      # свежая версия ветки (а не та, что была в момент нажатия Run workflow): если запуск ждал в очереди,
      # он увидит список уже озвученного предыдущим запуском и не будет озвучивать то же самое второй раз
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Язык и репозиторий с аудио
        run: |
          python3 scripts/langs.py check "$TUTOR_LANG"
          [ -f "scripts/langs/$TUTOR_LANG/tts.py" ] || { echo "::error::Нет scripts/langs/$TUTOR_LANG/tts.py"; exit 1; }
          # сервис: auto (или не подходящий этому языку) — тот, что указан для языка в langs.json
          OK=$(python3 "scripts/langs/$TUTOR_LANG/tts.py" --help | tr -d '\n' | grep -o -- '--engine {[^}]*}' | head -1 | grep -o '{.*}' | tr -d '{} ' | tr ',' ' ')
          DEF=$(python3 -c 'import json,sys; L=[x for x in json.load(open("langs.json"))["langs"] if x["code"]==sys.argv[1]]; print(L[0].get("tts",""))' "$TUTOR_LANG")
          E="$ENGINE"
          if [ "$E" = "auto" ] || ! echo " $OK " | grep -q " $E "; then
            [ "$E" != "auto" ] && echo "::warning::Сервис «$E» не подходит языку $TUTOR_LANG (подходят: $OK) — беру «$DEF» из langs.json"
            E="$DEF"
          fi
          echo " $OK " | grep -q " $E " || { echo "::error::Нет подходящего сервиса озвучки для $TUTOR_LANG (подходят: $OK)"; exit 1; }
          echo "ENGINE=$E" >> "$GITHUB_ENV"
          echo "Сервис озвучки: $E"
          echo "AUDIO_REPO=${AUDIO_REPO_PATTERN//\{lang\}/$TUTOR_LANG}" >> "$GITHUB_ENV"
          echo "VOICED=data/$TUTOR_LANG/audio_voiced.txt" >> "$GITHUB_ENV"
          echo "PRESENT=data/$TUTOR_LANG/audio_present.txt" >> "$GITHUB_ENV"

      - name: Зависимости
        run: |
          pip install openpyxl
          case "$ENGINE" in
            espeak) sudo apt-get update -q && sudo apt-get install -y -q espeak-ng ffmpeg ;;
            t5) sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
                pip install torch --index-url https://download.pytorch.org/whl/cpu
                pip install transformers sentencepiece huggingface_hub numpy ;;
            gtts|edge) pip install gTTS edge-tts ;;
          esac

      - name: Сборка словаря
        run: python3 "scripts/langs/$TUTOR_LANG/build_vocab.py"

      - name: Озвучка
        run: |
          set -o pipefail                         # ошибка tts.py не должна теряться в «| tee»
          mkdir -p out/audio
          python3 -u "scripts/langs/$TUTOR_LANG/tts.py" --out out/audio --engine "$ENGINE" ${VOICE:+--voice "$VOICE"} --limit "$LIMIT" | tee tts.log
          echo "## Озвучка ($TUTOR_LANG)" >> "$GITHUB_STEP_SUMMARY"
          tail -n 3 tts.log >> "$GITHUB_STEP_SUMMARY"
          echo "Файлов: $(ls out/audio | wc -l)" >> "$GITHUB_STEP_SUMMARY"

      - name: Архив с файлами (если нет доступа к репозиторию с аудио)
        if: env.AUDIO_REPO_TOKEN == ''
        uses: actions/upload-artifact@v4
        with:
          name: audio-and-list
          path: |
            out/audio
            data/${{ inputs.lang }}/audio_voiced.txt

      - name: Файлы → репозиторий с аудио
        if: env.AUDIO_REPO_TOKEN != ''
        run: |
          [ -n "$(ls out/audio)" ] || { echo "Новых файлов нет"; exit 0; }
          git clone --depth 1 "https://x-access-token:${AUDIO_REPO_TOKEN}@github.com/${AUDIO_REPO}.git" audio-repo
          mkdir -p audio-repo/audio
          cp out/audio/*.mp3 audio-repo/audio/
          touch audio-repo/.nojekyll              # GitHub Pages публикует файлы как есть, без сборки Jekyll (быстрее)
          # список всех файлов в репозитории с аудио — по нему приложение включает кнопки звука
          (cd audio-repo/audio && ls -1 *.mp3) | sort > "$PRESENT"
          cd audio-repo
          git config user.name "tutor bot"
          git config user.email "actions@users.noreply.github.com"
          git add audio .nojekyll
          git commit -m "Озвучка ($TUTOR_LANG): $(ls ../out/audio | wc -l) файлов" || exit 0
          git push

      - name: Отметить озвученные файлы и обновить словарь
        if: env.AUDIO_REPO_TOKEN != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "tutor bot"
          git config user.email "actions@users.noreply.github.com"
          [ -f "$VOICED" ] || { echo "Список озвученного ещё не создан — нечего отмечать"; exit 0; }
          git add "$VOICED"
          [ -f "$PRESENT" ] && git add "$PRESENT"
          git commit -m "Озвучено ($TUTOR_LANG): $(ls out/audio | wc -l) файлов" || { echo "Список не изменился"; exit 0; }
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push
          # коммит от GITHUB_TOKEN сам не запускает другие workflow — запускаем импорт словаря явно
          gh workflow run import-vocab.yml --ref "${GITHUB_REF_NAME}" -f lang="$TUTOR_LANG"

      # Серия: если ещё есть что озвучивать и этот запуск что-то озвучил — запускаем следующий с теми же настройками.
      # Останавливается, когда всё озвучено, если запуск ничего не смог озвучить, или после 30 запусков подряд.
      - name: Следующий запуск
        if: env.AUDIO_REPO_TOKEN != '' && inputs.auto
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LEFT=$(grep -o 'Осталось: [0-9]*' tts.log | tail -1 | grep -o '[0-9]*' || echo 0)
          NEW=$(ls out/audio 2>/dev/null | wc -l)
          R=$(( ${ROUND:-1} ))
          echo "Осталось: ${LEFT:-0}, озвучено сейчас: $NEW, запуск $R"
          if [ "${LEFT:-0}" -gt 0 ] && [ "$NEW" -gt 0 ] && [ "$R" -lt 30 ]; then
            gh workflow run tts.yml --ref "${GITHUB_REF_NAME}" -f lang="$TUTOR_LANG" -f engine="$ENGINE" -f voice="$VOICE" \
              -f limit="$LIMIT" -f auto=true -f pause="$PAUSE" -f round="$(( R + 1 ))"
            echo "- Следующий запуск ($(( R + 1 ))) начнётся через ${PAUSE} мин" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Серия озвучки завершена (осталось: ${LEFT:-0})" >> "$GITHUB_STEP_SUMMARY"
          fi
