# Публикация аудио на GitHub Pages (вместо встроенной сборки «pages build and deployment»).
# Запускается сама после каждой новой порции озвучки и вручную: Actions → «Публикация аудио» → Run workflow.
# В Settings → Pages должно быть выбрано Source: GitHub Actions.
name: Публикация аудио

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: audio-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
